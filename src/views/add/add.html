<section class="view view--add">
    <h1>Add</h1>

    <div class="field field--assigned" data-scope="assigned">
        <label class="field__label" for="assignedInput">Assigned</label>

        <div class="field__control" data-assigned="control">
            <input class="field__input" id="assignedInput" type="text" autocomplete="off" placeholder="Select contacts"
                data-action="ASSIGNED_FOCUS" />

            <button class="btn" type="button" data-action="ASSIGNED_OPEN" aria-label="Open assigned">
                ▼
            </button>

            <button class="btn" type="button" data-action="ASSIGNED_CLOSE" aria-label="Close assigned" hidden>
                ▲
            </button>
        </div>

        <div class="dropdown" data-assigned="dropdown" hidden>
            <button class="btn" type="button" data-action="ASSIGNED_PICK" data-name="Alice">Alice</button>
            <button class="btn" type="button" data-action="ASSIGNED_PICK" data-name="Bob">Bob</button>
        </div>
    </div>
</section>
