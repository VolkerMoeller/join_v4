<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./src/assets/favicon/favicon.svg" type="image/svg" />
    <title>JOIN v4</title>
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/layout-app.css" />
    <link rel="stylesheet" href="./styles/layout-auth.css" />
    <link rel="stylesheet" href="./styles/components/button.css" />
    <link rel="stylesheet" href="./styles/components/sidebar.css" />
    <link rel="stylesheet" href="./styles/components/overlay.css" />
    <link rel="stylesheet" href="./styles/components/field.css" />
    <link rel="stylesheet" href="./styles/components/auth.css" />

</head>

<body data-layout="app">

    <div class="app" id="appRoot">
        <header class="app__header">
            <div class="app__brand mobile-only">JOIN</div>
            <div class="app__brand desktop-only">Kanban Project Management Tool</div>
        </header>

        <div class="appShell">
            <main class="app__main" id="viewRoot" aria-live="polite"></main>
        </div>

        <aside class="sidebar" aria-label="Primary">
            <div class="sidebar__logo desktop-only">JOIN</div>
            <nav class="sidebar__nav">
                <button class="btn btn--nav" data-nav="summary" type="button">Summary</button>
                <button class="btn btn--nav" data-nav="add" type="button">Add Task</button>
                <button class="btn btn--nav" data-nav="board" type="button">Board</button>
                <button class="btn btn--nav" data-nav="contacts" type="button">Contacts</button>
            </nav>
            <nav class="sidebar__legal desktop-only">
                <button class="btn btn--legal" data-nav="legal" type="button">Legal notice</button>
                <button class="btn btn--legal" data-nav="privacy" type="button">Privacy Policy</button>
            </nav>
        </aside>
        <div class="overlay-root" id="overlayRoot" aria-hidden="true"></div>


        <script type="module" src="./src/app.js"></script>
</body>

</html>
